version: 0.2

phases:
  install:
    on-failure: ABORT
    commands:
       - echo "preparing environment"
  
  build:
    on-failure: ABORT
    commands:
       - |
         FILE="app/index.html"
         if [ -f "$FILE" ]; then
          echo "File exists"
         else
          echo "File missing"
          exit 1
         fi
artifacts:
  files:
     - app/index.html
     - appspec.yml
     - scripts/**/*

